<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문자광고 집행 관리 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F0F2F5;
  --card: #ffffff;
  --header: #1E293B;
  --header2: #334155;
  --primary: #2563EB;
  --primary-light: #EFF6FF;
  --purple: #7C3AED;
  --purple-light: #EDE9FE;
  --green: #0D9F6E;
  --green-light: #ECFDF5;
  --red: #EF4444;
  --red-light: #FEF2F2;
  --amber: #F59E0B;
  --amber-light: #FFFBEB;
  --gray: #6B7280;
  --gray-light: #F3F4F6;
  --border: #E2E8F0;
  --text: #1A1D23;
  --text2: #475569;
  --text3: #94A3B8;
  --shadow: 0 1px 8px rgba(0,0,0,.07);
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 13px; }
button { font-family: inherit; cursor: pointer; }
input, textarea { font-family: inherit; }
input:focus, textarea:focus { outline: none; border-color: var(--primary) !important; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }

/* HEADER */
.header { background: linear-gradient(135deg, var(--header), var(--header2)); color: #fff; padding: 22px 24px 0; }
.header-inner { max-width: 980px; margin: 0 auto; }
.header-label { font-size: 10px; font-weight: 600; color: var(--text3); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 4px; }
.header h1 { font-size: 20px; font-weight: 900; }
.header p { font-size: 11px; color: var(--text3); margin-top: 2px; margin-bottom: 18px; }
.tabs { display: flex; gap: 0; }
.tab-btn { padding: 10px 22px; border: none; background: transparent; color: var(--text3); font-weight: 700; font-size: 13px; cursor: pointer; border-radius: 8px 8px 0 0; transition: all .2s; }
.tab-btn.active { background: var(--bg); color: var(--header); }

/* LAYOUT */
.content { max-width: 980px; margin: 0 auto; padding: 20px 16px; }
.card { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }

/* TABS */
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* FORM ELEMENTS */
.field-label { display: block; font-size: 11px; font-weight: 700; color: var(--text2); margin-bottom: 6px; }
.btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
.toggle-btn { padding: 6px 14px; border-radius: 7px; border: 1.5px solid var(--border); background: #fff; color: var(--text2); font-size: 12px; font-weight: 700; transition: all .15s; }
.toggle-btn.active { border-color: var(--primary); background: var(--primary-light); color: var(--primary); border-width: 2px; }
.toggle-btn.active-purple { border-color: var(--purple); background: var(--purple-light); color: var(--purple); border-width: 2px; }
.input-wrap { position: relative; }
.search-input { width: 100%; padding: 10px 14px; border-radius: 9px; border: 1.5px solid var(--border); font-size: 14px; font-weight: 500; background: #F8FAFC; transition: all .15s; }
.rank-badge { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: var(--primary); color: #fff; padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 800; }
.dropdown { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: #fff; border-radius: 9px; border: 1.5px solid var(--border); box-shadow: 0 8px 24px rgba(0,0,0,.12); z-index: 200; max-height: 280px; overflow-y: auto; }
.dd-item { padding: 9px 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.dd-item:hover { background: var(--primary-light); }
.dd-item-name { font-weight: 600; font-size: 13px; }
.dd-item-rank { background: var(--gray-light); padding: 2px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; color: var(--primary); }
.dd-empty { padding: 14px; }
.main-btn { width: 100%; padding: 11px; border-radius: 9px; border: none; font-size: 14px; font-weight: 700; color: #fff; background: linear-gradient(135deg, var(--primary), #1D4ED8); transition: all .2s; }
.main-btn:disabled { background: #CBD5E1; cursor: not-allowed; }
.main-btn.purple { background: linear-gradient(135deg, var(--purple), #6D28D9); }

/* BADGES */
.badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 9px; font-weight: 700; white-space: nowrap; }
.badge-status-available { background: var(--green); color: #fff; border-radius: 999px; padding: 2px 8px; font-size: 10px; font-weight: 700; white-space: nowrap; }
.badge-status-review { background: var(--amber); color: #fff; border-radius: 999px; padding: 2px 8px; font-size: 10px; font-weight: 700; white-space: nowrap; }
.badge-status-unavailable { background: var(--red); color: #fff; border-radius: 999px; padding: 2px 8px; font-size: 10px; font-weight: 700; white-space: nowrap; }
.badge-status-unknown { background: var(--gray); color: #fff; border-radius: 999px; padding: 2px 8px; font-size: 10px; font-weight: 700; white-space: nowrap; }
.badge-cat-card { background: #DBEAFE; color: #1D4ED8; }
.badge-cat-tel { background: #E0E7FF; color: #4338CA; }
.badge-cat-member { background: #FEF3C7; color: #B45309; }
.badge-cat-mobility { background: #FFF7ED; color: #C2410C; }
.badge-cat-etc { background: var(--gray-light); color: var(--text2); }
.badge-type-lms { background: #E0F2FE; color: #0369A1; }
.badge-type-mms { background: #EDE9FE; color: #7C3AED; }
.badge-type-push { background: #FFF7ED; color: #C2410C; }
.badge-type-kakao { background: #FEF3C7; color: #B45309; }
.badge-agency-biz { background: #FEFCE8; color: #A16207; border: 1px solid #FDE68A; }
.badge-agency-dc { background: #EFF6FF; color: #1D4ED8; border: 1px solid #BFDBFE; }
.badge-agency-dh { background: #FFF1F2; color: #BE123C; border: 1px solid #FECDD3; }

/* SUMMARY GRID */
.summary-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 16px; }
.summary-card { border-radius: 9px; padding: 12px 10px; text-align: center; }
.summary-card .num { font-size: 22px; font-weight: 800; }
.summary-card .lbl { font-size: 10px; font-weight: 600; }

/* INFO BAR */
.info-bar { background: var(--header); border-radius: 9px; padding: 12px 16px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
.info-bar-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* TABLE */
.table-wrap { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 800px; }
thead tr { background: #F1F5F9; }
th { padding: 10px 6px; font-weight: 700; color: var(--text2); font-size: 9px; border-bottom: 2px solid var(--border); white-space: nowrap; }
td { padding: 7px 6px; border-bottom: 1px solid #F1F5F9; vertical-align: middle; }
tr.unavailable { opacity: 0.45; background: #FAFAFA; }
.type-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; }
.price-list { display: flex; flex-direction: column; align-items: center; gap: 2px; }

/* JOHAB */
.johab-banner { margin-bottom: 14px; padding: 12px 16px; border-radius: 9px; font-size: 12px; font-weight: 800; }
.notice-box { margin-top: 12px; padding: 10px 14px; background: var(--amber-light); border-radius: 7px; border: 1px solid #FDE68A; }
.notice-box li { font-size: 10px; color: #78716C; line-height: 1.7; margin-left: 14px; }

/* MESSAGE EDITOR */
.editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media(max-width:700px){ .editor-grid { grid-template-columns:1fr; } }
.guide-preview { margin-bottom: 14px; padding: 10px 12px; background: #F8FAFC; border-radius: 9px; border: 1px solid var(--border); }
.guide-preview .title { font-size: 10px; font-weight: 700; color: var(--text2); margin-bottom: 6px; }
.guide-preview .row { font-size: 10px; color: var(--text2); line-height: 1.8; }
textarea.msg-input { width: 100%; height: 180px; padding: 10px 12px; border-radius: 9px; border: 1.5px solid var(--border); font-size: 12px; line-height: 1.7; resize: vertical; }
.result-area { min-height: 320px; }
.result-block { margin-bottom: 12px; }
.result-block .blabel { font-size: 10px; font-weight: 700; color: var(--text2); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.result-title-box { padding: 10px 12px; background: #F0F9FF; border-radius: 8px; border: 1.5px solid #BAE6FD; font-size: 12px; line-height: 1.6; white-space: pre-wrap; }
.result-body-box { padding: 10px 12px; background: #F8FAFC; border-radius: 8px; border: 1.5px solid var(--border); font-size: 12px; line-height: 1.8; white-space: pre-wrap; max-height: 360px; overflow-y: auto; }
.byte-row { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
.byte-tag { font-size: 10px; background: #F1F5F9; color: var(--text2); padding: 2px 8px; border-radius: 5px; }
.byte-tag.ok { background: var(--green-light); color: var(--green); font-weight: 600; }
.byte-tag.over { background: var(--red-light); color: var(--red); font-weight: 600; }
.empty-state { height: 320px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text3); gap: 10px; }
.empty-state .icon { font-size: 36px; }
.loading-state { height: 320px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text3); gap: 12px; }
.spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--purple); border-radius: 50%; animation: spin .7s linear infinite; }

/* GUIDE DETAIL */
.guide-detail { margin-top: 16px; background: var(--card); border-radius: var(--radius); padding: 16px 20px; box-shadow: var(--shadow); }
.guide-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
@media(max-width:600px){ .guide-detail-grid { grid-template-columns:1fr; } }
.guide-rule { font-size: 11px; color: #374151; line-height: 1.7; display: flex; gap: 6px; margin-bottom: 2px; }
.rule-num { color: var(--red); font-weight: 700; flex-shrink: 0; }
.required-box { padding: 8px 10px; background: #FEF9C3; border-radius: 7px; border: 1px solid #FDE68A; font-size: 10px; color: #78350F; line-height: 1.8; white-space: pre-wrap; }

/* ANIMATIONS */
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
.fade-up { animation: fadeUp .3s ease-out forwards; }

/* COPY BTN */
.copy-btn { padding: 5px 12px; border-radius: 7px; border: 1.5px solid var(--border); background: #F8FAFC; color: var(--text2); font-size: 11px; font-weight: 600; }
.copy-btn.copied { background: var(--green-light); color: var(--green); border-color: #6EE7B7; }

/* JOHAB TYPE BUTTONS */
.johab-type-btn { flex: 1; padding: 8px 10px; border-radius: 7px; border: 1.5px solid var(--border); background: #fff; cursor: pointer; text-align: left; }
.johab-type-btn.red { border-color: var(--red); background: var(--red-light); border-width: 2px; }
.johab-type-btn.green { border-color: var(--green); background: var(--green-light); border-width: 2px; }

/* SIGO SECTION */
.sigo-section { margin-top: 14px; padding: 14px; background: #F0F9FF; border-radius: 10px; border: 1.5px solid #BAE6FD; position: relative; }

/* ERROR BOX */
.error-box { margin-top: 8px; padding: 8px 12px; background: var(--red-light); border-radius: 7px; font-size: 11px; color: #DC2626; }

/* MANUAL INPUT */
.manual-box { margin-top: 12px; padding: 12px; background: var(--amber-light); border-radius: 9px; border: 1px solid #FDE68A; }

/* RESULT HEADER */
.result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-label">SMS AD Management Tool</div>
    <h1>문자광고 집행 관리 시스템</h1>
    <p>비즈그리다 · 디지털캠프 · 대홍기획 — 집행가능여부 조회 + 매체 가이드 문구 수정</p>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('check')">① 집행 가능여부 조회</button>
      <button class="tab-btn" onclick="switchTab('edit')">② 매체 가이드 문구 수정</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     TAB 1: FEASIBILITY CHECK
══════════════════════════════════════════ -->
<div id="tab-check" class="tab-panel active">
<div class="content">
<div class="card">

  <!-- 대행사 선택 -->
  <div style="margin-bottom:14px">
    <span class="field-label">대행사 선택</span>
    <div class="btn-group" id="agency-group">
      <button class="toggle-btn active" onclick="setAgency('all',this)">전체 비교</button>
      <button class="toggle-btn" onclick="setAgency('biz',this)">비즈그리다</button>
      <button class="toggle-btn" onclick="setAgency('dc',this)">디지털캠프</button>
      <button class="toggle-btn" onclick="setAgency('dh',this)">대홍기획</button>
    </div>
  </div>

  <!-- 건설사 검색 -->
  <div style="position:relative; margin-bottom:4px">
    <label class="field-label" id="search-label">건설사 검색</label>
    <div class="input-wrap">
      <input type="text" id="company-input" class="search-input"
        placeholder="예) 현대건설, 황학동청계지역주택조합..."
        oninput="onCompanyInput(this.value)"
        onfocus="onCompanyFocus()"
        autocomplete="off">
      <span id="rank-badge-main" class="rank-badge" style="display:none"></span>
    </div>
    <div id="company-dropdown" class="dropdown" style="display:none"></div>
  </div>

  <!-- 직접입력 -->
  <div id="manual-box" class="manual-box" style="display:none">
    <input type="number" id="manual-rank" placeholder="도급순위 직접 입력 (위)" min="1"
      oninput="onManualRank(this.value)"
      style="width:100%;padding:8px 12px;border-radius:7px;border:1.5px solid #FDE68A;font-size:13px;background:#fff">
  </div>

  <!-- 조합: 시공사 -->
  <div id="sigo-section" class="sigo-section" style="display:none">
    <label class="field-label" style="color:#0369A1;margin-bottom:5px">② 시공사 검색 <span id="sigo-match" style="color:var(--green);font-size:10px"></span></label>
    <div class="input-wrap" style="position:relative">
      <input type="text" id="sigo-input" class="search-input"
        placeholder="시공사명 (예: 현대건설...)"
        oninput="onSigoInput(this.value)"
        onfocus="onSigoFocus()"
        autocomplete="off">
      <span id="rank-badge-sigo" class="rank-badge" style="display:none"></span>
    </div>
    <div id="sigo-dropdown" class="dropdown" style="display:none"></div>
    <div id="sigo-manual-box" style="display:none;margin-top:8px">
      <input type="number" id="sigo-manual-rank" placeholder="시공사 도급순위 (위)" min="1"
        oninput="onSigoManual(this.value)"
        style="width:100%;padding:8px 12px;border-radius:7px;border:1.5px solid #FDE68A;font-size:13px;background:#FFFBEB">
    </div>
  </div>

  <!-- 조합 유형 -->
  <div id="johab-type-section" style="display:none;margin-top:14px;padding:12px;background:#FEF9EE;border-radius:9px;border:1.5px solid var(--amber)">
    <span class="field-label" style="color:#92400E;margin-bottom:6px;display:block">③ 분양 유형</span>
    <div style="display:flex;gap:8px">
      <button class="johab-type-btn red" onclick="setJohabType('recruit',this)">
        <div style="font-size:12px;font-weight:700;color:var(--red)">조합원 모집</div>
        <div style="font-size:10px;color:var(--text3);margin-top:1px">전매체 불가</div>
      </button>
      <button class="johab-type-btn" onclick="setJohabType('ilban',this)">
        <div style="font-size:12px;font-weight:700;color:var(--text2)">일반분양</div>
        <div style="font-size:10px;color:var(--text3);margin-top:1px">KB국민카드외 지정매체 가능</div>
      </button>
    </div>
  </div>

  <!-- 지역 -->
  <div style="margin-top:14px">
    <span class="field-label" id="region-label">지역</span>
    <div class="btn-group" id="region-group">
      <button class="toggle-btn active" onclick="setRegion('수도권',this)">수도권</button>
      <button class="toggle-btn" onclick="setRegion('광역시',this)">광역시</button>
      <button class="toggle-btn" onclick="setRegion('세종시',this)">세종시</button>
      <button class="toggle-btn" onclick="setRegion('지방',this)">지방</button>
    </div>
  </div>

  <button class="main-btn" id="check-btn" onclick="doCheck()" disabled style="margin-top:16px">조회하기</button>
</div>

<!-- 결과 -->
<div id="result-area" style="margin-top:20px;display:none" class="fade-up">
  <div id="johab-banner"></div>
  <div class="summary-grid" id="summary-grid"></div>
  <div class="info-bar" id="info-bar"></div>
  <div class="table-wrap"><table id="result-table">
    <thead id="result-thead"></thead>
    <tbody id="result-tbody"></tbody>
  </table></div>
  <div class="notice-box"><ul id="notice-list"></ul></div>
</div>

</div>
</div>

<!-- ══════════════════════════════════════════
     TAB 2: MESSAGE EDITOR
══════════════════════════════════════════ -->
<div id="tab-edit" class="tab-panel">
<div class="content">

<div class="editor-grid">
  <!-- LEFT -->
  <div class="card">
    <div style="margin-bottom:14px">
      <span class="field-label">매체사 선택</span>
      <div class="btn-group" id="media-group">
        <button class="toggle-btn active" onclick="setMedia('신한카드',this)">신한카드</button>
        <button class="toggle-btn" onclick="setMedia('삼성카드',this)">삼성카드</button>
        <button class="toggle-btn" onclick="setMedia('롯데카드',this)">롯데카드</button>
        <button class="toggle-btn" onclick="setMedia('BC카드',this)">BC카드</button>
        <button class="toggle-btn" onclick="setMedia('KB국민카드',this)">KB국민카드</button>
        <button class="toggle-btn" onclick="setMedia('하나카드',this)">하나카드</button>
      </div>
    </div>

    <div style="margin-bottom:14px">
      <span class="field-label">발송 유형</span>
      <div class="btn-group" id="msgtype-group">
        <button class="toggle-btn active-purple" onclick="setMsgType('LMS',this)">LMS</button>
        <button class="toggle-btn" onclick="setMsgType('MMS',this)">MMS</button>
        <button class="toggle-btn" onclick="setMsgType('PUSH',this)">PUSH</button>
      </div>
    </div>

    <div id="guide-preview" class="guide-preview"></div>

    <span class="field-label">원본 문구 입력</span>
    <textarea id="msg-input" class="msg-input"
      placeholder="수정이 필요한 원본 문자 문구를 붙여넣기 해주세요.&#10;&#10;예) 현대힐스테이트 분양 안내&#10;OOO 고객님 안녕하세요.&#10;선착순 동호 지정 분양 진행 중입니다.&#10;■ 문의: 1668-XXXX"></textarea>

    <button class="main-btn purple" id="edit-btn" onclick="doEdit()" style="margin-top:12px">✨ 매체 가이드에 맞게 문구 수정</button>
    <div id="edit-error" class="error-box" style="display:none"></div>
  </div>

  <!-- RIGHT -->
  <div class="card">
    <div class="result-header">
      <div style="font-size:13px;font-weight:700">수정된 문구</div>
      <button class="copy-btn" id="copy-btn" onclick="copyResult()" style="display:none">전체 복사</button>
    </div>
    <div id="edit-result" class="result-area">
      <div class="empty-state">
        <div class="icon">📝</div>
        <div style="font-size:12px">원본 문구를 입력하고 수정 버튼을 눌러주세요</div>
      </div>
    </div>
  </div>
</div>

<div id="guide-detail" class="guide-detail" style="display:none"></div>

</div>
</div>

<script>
/* ═══════════════════════════════════════
   DATA
═══════════════════════════════════════ */
const RANK_DB = [
  {name:"삼성물산",rank:1},{name:"현대건설",rank:2},{name:"대우건설",rank:3},

/* ═══════════════════════════════════════
   HELPERS
═══════════════════════════════════════ */
function searchCompany(q){
  if(!q||!q.trim()) return [];
  const s=q.trim().toLowerCase();
  return RANK_DB.filter(c=>c.name.toLowerCase().includes(s)||(c.aliases&&c.aliases.some(a=>a.toLowerCase().includes(s)))).slice(0,8);
}
function detectJohab(q){ return q&&(q.includes('조합')||q.includes('지주택')||q.endsWith('주택조합')); }
function getRankNum(){
  if(state.isJohab){ if(state.selectedSigo) return state.selectedSigo.rank; if(state.sigoUseManual) return state.sigoManualRank||0; return 0; }
  if(state.selectedCompany) return state.selectedCompany.rank;
  if(state.useManual) return state.manualRank||0;
  return 0;
}
function getAgencyKeys(){ return state.agency==='all'?['biz','dc','dh']:[state.agency]; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function parseType(str){
  const p=str.split(' '); const name=p.slice(0,-1).join(' '); const pr=p[p.length-1];
  const isPromo=pr.endsWith('*'); const clean=pr.replace('*','');
  const price=isNaN(parseInt(clean))?clean:parseInt(clean)+'원';
  return{name,price,isPromo};
}

function typeBadge(name){
  let cls='badge-type-lms';
  if(name.includes('MMS')) cls='badge-type-mms';
  else if(name.includes('KAKAO')||name.includes('카플친')) cls='badge-type-kakao';
  else if(name.includes('PUSH')) cls='badge-type-push';
  return `<span class="badge ${cls}">${esc(name)}</span>`;
}
function catBadge(cat){
  const map={'카드사':'badge-cat-card','통신사':'badge-cat-tel','멤버십':'badge-cat-member','모빌리티':'badge-cat-mobility'};
  return `<span class="badge ${map[cat]||'badge-cat-etc'}">${esc(cat)}</span>`;
}
function statusBadge(s){
  const map={available:'가능',review:'검토',unavailable:'불가',unknown:'확인'};
  return `<span class="badge-status-${s}">${map[s]||'확인'}</span>`;
}
function johabBadge(media,johabType){
  const blocked=johabType==='recruit'||!media.ilbanOk;
  return `<span class="badge" style="background:${blocked?'#FEE2E2':'#D1FAE5'};color:${blocked?'#DC2626':'#065F46'}">${blocked?'불가':'가능'}</span>`;
}

function doCheck(){
  const rankNum=getRankNum();
  if(rankNum<1) return;
  const agencyKeys=getAgencyKeys();
  const filtered=MEDIA.filter(m=>agencyKeys.some(k=>m[k]!=null));

  const results=filtered.map(m=>{
    let status=m.rankRule(rankNum,state.region);
    if(state.isJohab){
      if(state.johabType==='recruit') status='unavailable';
      else if(!m.ilbanOk) status='unavailable';
    }
    return{...m,status};
  });

  const order={available:0,review:1,unknown:2,unavailable:3};
  const sorted=[...results].sort((a,b)=>(order[a.status]||4)-(order[b.status]||4));

  const counts={available:0,review:0,unknown:0,unavailable:0};
  results.forEach(r=>{counts[r.status]=(counts[r.status]||0)+1;});

  renderResult(sorted,counts,rankNum,agencyKeys);
}

function renderResult(sorted,counts,rankNum,agencyKeys){
  // johab banner
  const banner=document.getElementById('johab-banner');
  if(state.isJohab){
    const isRecruit=state.johabType==='recruit';
    banner.innerHTML=`<div class="johab-banner" style="background:${isRecruit?'#FEE2E2':'#D1FAE5'};border:1.5px solid ${isRecruit?'#EF4444':'#0D9F6E'};color:${isRecruit?'#991B1B':'#065F46'}">${isRecruit?'🚫 조합원 모집 — 전 매체 집행 불가 (참고용)':'✅ 일반분양 — KB국민카드 제외 지정매체 가능'}</div>`;
  } else banner.innerHTML='';

  // summary
  document.getElementById('summary-grid').innerHTML=[
    {l:'가능',c:counts.available,co:'var(--green)',bg:'var(--green-light)'},
    {l:'검토',c:counts.review,co:'var(--amber)',bg:'var(--amber-light)'},
    {l:'확인',c:counts.unknown,co:'var(--gray)',bg:'var(--gray-light)'},
    {l:'불가',c:counts.unavailable,co:'var(--red)',bg:'var(--red-light)'},
  ].map(s=>`<div class="summary-card" style="background:${s.bg}"><div class="num" style="color:${s.co}">${s.c}</div><div class="lbl" style="color:${s.co}">${s.l}</div></div>`).join('');

  // info bar
  const compName=state.isJohab?document.getElementById('company-input').value:(state.selectedCompany?state.selectedCompany.name:document.getElementById('company-input').value||'직접');
  const sigoName=state.selectedSigo?state.selectedSigo.name:(document.getElementById('sigo-input').value||'직접');
  document.getElementById('info-bar').innerHTML=`
    <div class="info-bar-left">
      <span style="color:var(--text3);font-size:10px">${state.isJohab?'조합':'건설사'}</span>
      <span style="color:#fff;font-weight:800">${esc(compName)}</span>
      ${state.isJohab?`<span style="background:${state.johabType==='recruit'?'var(--red)':'var(--green)'};color:#fff;padding:1px 6px;border-radius:4px;font-size:9px;font-weight:700">${state.johabType==='recruit'?'조합원모집':'일반분양'}</span><span style="color:var(--text3);font-size:10px">시공사</span><span style="color:#60A5FA;font-weight:800">${esc(sigoName)}</span>`:''}
    </div>
    <div style="display:flex;gap:16px">
      <div><span style="color:var(--text3);font-size:10px">순위 </span><span style="color:#60A5FA;font-weight:800">${rankNum}위</span><span style="color:#475569;font-size:9px"> ('25)</span></div>
      <div><span style="color:var(--text3);font-size:10px">지역 </span><span style="color:#60A5FA;font-weight:800">${state.region}</span></div>
    </div>`;

  // table head
  const isJ=state.isJohab;
  document.getElementById('result-thead').innerHTML=`<tr>${['매체사','분류','상태',...(isJ?['조합']:[]),'대행사','유형','단가(VAT별도)','최소집행','비고'].map((h,i)=>`<th style="text-align:${i===0||i===(['매체사','분류','상태',...(isJ?['조합']:[]),'대행사','유형','단가(VAT별도)','최소집행','비고'].length-1)===i?'left':'center'}">${h}</th>`).join('')}</tr>`;

  // table body
  let tbody='';
  sorted.forEach(m=>{
    const activeKeys=agencyKeys.filter(k=>m[k]!=null);
    if(!activeKeys.length) return;
    activeKeys.forEach((ak,idx)=>{
      const data=m[ak];
      const info=AGENCIES_INFO[ak];
      const parsed=data.types.map(parseType);
      const isFirst=idx===0;
      const span=activeKeys.length;
      const unavail=m.status==='unavailable';
      tbody+=`<tr class="${unavail?'unavailable':''}">`;
      if(isFirst){
        tbody+=`<td rowspan="${span}" style="font-weight:700;font-size:11px;white-space:nowrap;border-right:1px solid #F1F5F9">${esc(m.name)}</td>`;
        tbody+=`<td rowspan="${span}" style="text-align:center;border-right:1px solid #F1F5F9">${catBadge(m.cat)}</td>`;
        tbody+=`<td rowspan="${span}" style="text-align:center;border-right:1px solid #F1F5F9">${statusBadge(m.status)}</td>`;
        if(isJ) tbody+=`<td rowspan="${span}" style="text-align:center;border-right:1px solid #F1F5F9">${johabBadge(m,state.johabType)}</td>`;
      }
      tbody+=`<td style="text-align:center;border-right:1px solid #F1F5F9"><span class="badge ${info.cls}">${info.label}</span></td>`;
      tbody+=`<td style="text-align:center;border-right:1px solid #F1F5F9"><div class="type-list">${parsed.map(p=>typeBadge(p.name)).join('')}</div></td>`;
      tbody+=`<td style="text-align:center;border-right:1px solid #F1F5F9"><div class="price-list">${parsed.map(p=>`<span style="font-size:11px;font-weight:600;white-space:nowrap">${esc(p.price)}${p.isPromo?'<span style="color:var(--red);font-size:8px;margin-left:2px">*프로모션</span>':''}</span>`).join('')}</div></td>`;
      tbody+=`<td style="text-align:center;font-weight:600;font-size:11px;border-right:1px solid #F1F5F9;white-space:nowrap">${esc(data.min)}</td>`;
      tbody+=`<td style="font-size:9px;color:var(--text2);line-height:1.4;max-width:180px">`;
      if(isFirst){
        tbody+=`<div>${esc(m.rankDesc)}</div>`;
        if(isJ&&m.johabNote) tbody+=`<div style="color:var(--red);font-weight:700;margin-top:1px">${esc(m.johabNote)}</div>`;
        if(m.extra) tbody+=`<div style="color:var(--red);font-weight:600;margin-top:1px">${esc(m.extra)}</div>`;
        if(m.extra2) tbody+=`<div style="color:var(--red);font-weight:700;margin-top:1px">${esc(m.extra2)}</div>`;
      }
      if(data.note) tbody+=`<div style="color:var(--primary);margin-top:1px">${esc(data.note)}</div>`;
      tbody+=`</td></tr>`;
    });
  });
  document.getElementById('result-tbody').innerHTML=tbody;

  // notice
  let notices=['도급순위: 2025년 국토교통부 시공능력평가 기준','단가 VAT 별도. 대행사별 동일 매체도 단가/최소집행/상품이 다를 수 있음'];
  if(state.isJohab&&state.johabType==='recruit') notices.push('<span style="color:var(--red);font-weight:700">조합원 모집 시 전 매체 집행 불가</span>');
  if(state.isJohab&&state.johabType==='ilban') notices.push('<span style="color:var(--red);font-weight:700">KB국민카드는 지역주택조합 전체 불가</span>');
  document.getElementById('notice-list').innerHTML=notices.map(n=>`<li>${n}</li>`).join('');

  const ra=document.getElementById('result-area');
  ra.style.display='';
  ra.classList.remove('fade-up');
  void ra.offsetWidth;
  ra.classList.add('fade-up');
}

  html+=`<div class="guide-detail-grid">`;

  (g.rules||[]).forEach((r,i)=>{ html+=`<div class="guide-rule"><span class="rule-num">${i+1}.</span>${esc(r)}</div>`; });
  html+=`</div>`;
  if(g.required){
    html+=`<div><div class="field-label" style="margin-bottom:6px">필수 하단 문구</div><div class="required-box">${esc(g.required)}</div></div>`;
  }
  html+=`</div>`;

  el.style.display='';

function renderEditResult(data){
  const el=document.getElementById('edit-result');
  const copyBtn=document.getElementById('copy-btn');
  if(!data){
    el.innerHTML=`<div class="empty-state"><div class="icon">📝</div><div style="font-size:12px">원본 문구를 입력하고 수정 버튼을 눌러주세요</div></div>`;
    copyBtn.style.display='none';
    return;
  }
  if(data==='loading'){
    el.innerHTML=`<div class="loading-state"><div class="spinner"></div><div style="font-size:12px">${esc(state.selectedMedia)} 가이드 분석 중...</div></div>`;
    copyBtn.style.display='none';
    return;
  }
  const g=MEDIA_GUIDES[state.selectedMedia];
  const bodyBytes=new Blob([data.body]).size;
  const overLimit=g&&g.maxBytes&&bodyBytes>g.maxBytes;
  let html=`<div class="fade-up">`;
  html+=`<div class="result-block"><div class="blabel">제목 <span class="badge badge-agency-dc" style="font-size:9px">${esc(state.selectedMedia)} 헤더 포함</span></div><div class="result-title-box">${esc(data.title||'(제목 없음)')}</div></div>`;
  html+=`<div class="result-block"><div class="blabel">본문 (필수문구 포함)</div><div class="result-body-box">${esc(data.body)}</div></div>`;
  html+=`<div class="byte-row"><span class="byte-tag">본문 약 ${bodyBytes} bytes</span>`;
  if(g&&g.maxBytes) html+=`<span class="byte-tag ${overLimit?'over':'ok'}">${overLimit?`⚠ 제한 초과 (${g.maxBytes}B)`:`✓ 용량 정상 (${g.maxBytes}B 이내)`}</span>`;
  html+=`</div></div>`;
  el.innerHTML=html;
  copyBtn.style.display='';
  state.editResult=data;
}

async function doEdit(){
  const input=document.getElementById('msg-input').value.trim();
  if(!input) return;
  document.getElementById('edit-error').style.display='none';
  renderEditResult('loading');

  const g=MEDIA_GUIDES[state.selectedMedia];
  const guideText=g?`
매체: ${state.selectedMedia}
발송 유형: ${state.msgType}
헤더(제목 고정): ${g.header||''}
${g.headerAlt?'대체 헤더: '+g.headerAlt:''}
${g.maxBytes?'최대 Bytes: '+g.maxBytes:''}
${g.titleMaxBytes?'제목 최대 Bytes: '+g.titleMaxBytes:''}
필수 하단 문구: ${g.required||'없음'}
${g.eventRequired?'이벤트 필수조건: '+g.eventRequired:''}
준수 규칙:
${(g.rules||[]).map((r,i)=>`${i+1}. ${r}`).join('\n')}`:`매체: ${state.selectedMedia}\n발송 유형: ${state.msgType}`;

  const prompt=`당신은 문자광고 문구 전문가입니다. 아래 매체 가이드에 맞게 원본 문구를 수정해주세요.

[매체 가이드]
${guideText}

[원본 문구]
${input}

[수정 지침]
1. 원본 내용(단지명, 혜택, 연락처 등 핵심 정보)은 최대한 유지
2. 매체 가이드의 헤더/필수문구/규칙을 반드시 반영
3. 분양 광고이므로 "OOO 고객님" 형식의 수신자 호칭 포함
4. 가이드에서 요구하는 이벤트 문구나 카드사 전용 혜택 문구 추가
5. 수정된 최종 문구만 출력 (설명 없이)
6. 반드시 아래 형식으로 출력:

[제목]
(수정된 제목)

[본문]
(수정된 본문 전체, 필수문구 포함)`;

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})
    });
    const data=await res.json();
    const text=(data.content||[]).map(b=>b.text||'').join('');
    const titleMatch=text.match(/\[제목\]\s*([\s\S]*?)(?=\[본문\])/);
    const bodyMatch=text.match(/\[본문\]\s*([\s\S]*)/);
    renderEditResult({
      title:titleMatch?titleMatch[1].trim():'',
      body:bodyMatch?bodyMatch[1].trim():text.trim()
    });
  } catch(e){
    renderEditResult(null);
    const err=document.getElementById('edit-error');
    err.textContent='API 호출 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.';
    err.style.display='';
  }
}

function copyResult(){
  if(!state.editResult) return;
  const txt=`[제목]\n${state.editResult.title}\n\n[본문]\n${state.editResult.body}`;
  navigator.clipboard.writeText(txt).then(()=>{
    const btn=document.getElementById('copy-btn');
    btn.textContent='✓ 복사됨';
    btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent='전체 복사'; btn.classList.remove('copied'); },2000);
  });
}
